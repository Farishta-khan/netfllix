<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin - Manage Movies</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;background:#121212;color:#fff;padding:24px}
    .card{background:#181818;padding:16px;border-radius:6px;margin-bottom:16px}
    input,textarea,select{width:100%;padding:8px;margin:6px 0;border-radius:4px;border:1px solid #333;background:#050505;color:#fff}
    button{background:#e50914;color:#fff;border:none;padding:8px 12px;border-radius:4px;cursor:pointer}
    table{width:100%;border-collapse:collapse;margin-top:12px}
    th,td{padding:8px;border-bottom:1px solid #222;text-align:left}
    .small{width:120px}
    .muted{color:#b3b3b3}
  </style>
</head>
<body>
  <h1>Admin - Movies</h1>
  <div class="card">
    <label>Admin token (X-Admin-Token):</label>
    <input id="adminToken" placeholder="Paste your admin token here">
    <div style="margin-top:8px">
      <button onclick="loadMovies()">Load movies</button>
      <button onclick="showCreateForm()">New movie</button>
    </div>
  </div>

  <div id="list" class="card"></div>

  <div id="formCard" class="card" style="display:none">
    <h3 id="formTitle">New Movie</h3>
    <input id="m_id" type="hidden">
    <label>Title</label>
    <input id="m_title">
    <label>Image URL</label>
    <input id="m_image">
    <label>Video URL</label>
    <input id="m_video">
    <label>Trailer URL</label>
    <input id="m_trailer">
    <label>Genre</label>
    <input id="m_genre">
    <label>Release Year</label>
    <input id="m_year" type="number">
    <label>Rating</label>
    <input id="m_rating" type="number" step="0.1">
    <label>Duration</label>
    <input id="m_duration">
    <label>Description</label>
    <textarea id="m_description" rows="3"></textarea>
    <label>Featured</label>
    <select id="m_featured"><option value="0">No</option><option value="1">Yes</option></select>
    <div style="margin-top:8px">
      <button onclick="submitMovie()">Save</button>
      <button onclick="hideForm()" style="background:#444;margin-left:8px">Cancel</button>
    </div>
  </div>

  <script>
    const API = 'movies.php'; // relative to this file

    function getToken() { return document.getElementById('adminToken').value.trim(); }

    async function loadMovies(){
      const token = getToken();
      if(!token){ alert('Enter admin token first'); return; }
      const res = await fetch(API, { headers: { 'X-Admin-Token': token } });
      const data = await res.json();
      if(data.status !== 'success'){ alert('Error: '+(data.message||'unknown')); return; }
      renderList(data.data);
    }

    function renderList(items){
      const el = document.getElementById('list');
      if(!items.length){ el.innerHTML = '<div class="muted">No movies found</div>'; return; }
      let html = '<table><thead><tr><th>Id</th><th>Title</th><th class="small">Genre</th><th class="small">Year</th><th class="small">Rating</th><th class="small">Featured</th><th>Actions</th></tr></thead><tbody>';
      items.forEach(m => {
        html += `<tr><td>${m.id}</td><td>${escapeHtml(m.title)}</td><td>${escapeHtml(m.genre||'')}</td><td>${m.release_year||''}</td><td>${m.rating||''}</td><td>${m.featured? 'Yes':'No'}</td><td>`+
                `<button onclick="editMovie(${m.id})">Edit</button> `+
                `<button onclick="deleteMovie(${m.id})" style="background:#444;margin-left:6px">Delete</button> `+
                `<button onclick="toggleFeatured(${m.id}, ${m.featured?0:1})" style="background:#666;margin-left:6px">${m.featured? 'Unfeature':'Feature'}</button>`+
                `</td></tr>`;
      });
      html += '</tbody></table>';
      el.innerHTML = html;
    }

    function escapeHtml(s){ return (s||'').replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

    function showCreateForm(){
      document.getElementById('formTitle').textContent = 'New Movie';
      document.getElementById('m_id').value = '';
      ['m_title','m_image','m_video','m_trailer','m_genre','m_year','m_rating','m_duration','m_description'].forEach(id=>document.getElementById(id).value='');
      document.getElementById('m_featured').value = '0';
      document.getElementById('formCard').style.display = 'block';
      window.scrollTo(0,document.body.scrollHeight);
    }

    async function editMovie(id){
      const token = getToken(); if(!token){ alert('Enter admin token first'); return; }
      const res = await fetch(API+'?id='+id, { headers: { 'X-Admin-Token': token }});
      const data = await res.json();
      if(data.status !== 'success'){ alert('Error: '+(data.message||'unknown')); return; }
      const m = data.data;
      document.getElementById('formTitle').textContent = 'Edit Movie '+m.id;
      document.getElementById('m_id').value = m.id;
      document.getElementById('m_title').value = m.title||'';
      document.getElementById('m_image').value = m.image_url||'';
      document.getElementById('m_video').value = m.video_url||'';
      document.getElementById('m_trailer').value = m.trailer_url||'';
      document.getElementById('m_genre').value = m.genre||'';
      document.getElementById('m_year').value = m.release_year||'';
      document.getElementById('m_rating').value = m.rating||'';
      document.getElementById('m_duration').value = m.duration||'';
      document.getElementById('m_description').value = m.description||'';
      document.getElementById('m_featured').value = m.featured? '1':'0';
      document.getElementById('formCard').style.display = 'block';
      window.scrollTo(0,document.body.scrollHeight);
    }

    function hideForm(){ document.getElementById('formCard').style.display='none'; }

    async function submitMovie(){
      const token = getToken(); if(!token){ alert('Enter admin token first'); return; }
      const id = document.getElementById('m_id').value;
      const body = {
        title: document.getElementById('m_title').value,
        image_url: document.getElementById('m_image').value,
        video_url: document.getElementById('m_video').value,
        trailer_url: document.getElementById('m_trailer').value,
        genre: document.getElementById('m_genre').value,
        release_year: Number(document.getElementById('m_year').value)||null,
        rating: Number(document.getElementById('m_rating').value)||0,
        duration: document.getElementById('m_duration').value,
        description: document.getElementById('m_description').value,
        featured: Number(document.getElementById('m_featured').value)||0
      };
      let res, data;
      if(id){
        res = await fetch(API+'?id='+id, { method: 'PUT', headers: {'Content-Type':'application/json','X-Admin-Token': token}, body: JSON.stringify(body) });
        data = await res.json();
      } else {
        res = await fetch(API, { method: 'POST', headers: {'Content-Type':'application/json','X-Admin-Token': token}, body: JSON.stringify(body) });
        data = await res.json();
      }
      if(data.status === 'success'){
        alert('Saved'); hideForm(); loadMovies();
      } else alert('Error: '+(data.message||'unknown'));
    }

    async function deleteMovie(id){ if(!confirm('Delete movie '+id+'?')) return; const token = getToken(); if(!token){ alert('Enter admin token first'); return; } const res = await fetch(API+'?id='+id,{ method:'DELETE', headers: {'X-Admin-Token': token}}); const data = await res.json(); if(data.status==='success'){ alert('Deleted'); loadMovies(); } else alert('Error: '+(data.message||'unknown')); }

    async function toggleFeatured(id, val){ const token = getToken(); if(!token){ alert('Enter admin token first'); return; } const res = await fetch(API+'?id='+id,{ headers: {'X-Admin-Token': token}}); const data = await res.json(); if(data.status!=='success'){ alert('Error: '+(data.message||'unknown')); return; } const m = data.data; m.featured = val; // update
      const res2 = await fetch(API+'?id='+id, { method:'PUT', headers: {'Content-Type':'application/json','X-Admin-Token': token}, body: JSON.stringify(m) }); const r2 = await res2.json(); if(r2.status==='success'){ loadMovies(); } else alert('Error: '+(r2.message||'unknown'));
    }

    // auto-load if token present in query
    (function(){ const params = new URLSearchParams(location.search); if(params.get('token')){ document.getElementById('adminToken').value = params.get('token'); loadMovies(); } })();
  </script>
</body>
</html>
